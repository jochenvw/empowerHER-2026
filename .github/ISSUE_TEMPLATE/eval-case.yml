name: New eval case
description: Propose a deterministic evaluation case.
title: "[eval-case] "
labels: ["evaluation"]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The text or context to evaluate.
    validations:
      required: true
  - type: textarea
    id: bad_behavior
    attributes:
      label: Bad behavior to detect
      description: What unacceptable behavior should be flagged.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected safer behavior
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: bias_pattern
    attributes:
      label: Relevant bias/fairness pattern
      description: Which fairness risk pattern this case targets.
    validations:
      required: true

