name: Improve existing agent
description: Suggest an improvement to an existing agent.
title: "[improve-agent] "
labels: ["improvement", "agent"]
body:
  - type: input
    id: agent_name
    attributes:
      label: Which agent?
      description: Name/path of the current agent.
    validations:
      required: true
  - type: textarea
    id: problem_observed
    attributes:
      label: Problem observed
      description: What is not working as expected.
    validations:
      required: true
  - type: textarea
    id: proposed_improvement
    attributes:
      label: Proposed improvement
      description: How the behavior should change.
    validations:
      required: true
  - type: textarea
    id: how_to_test
    attributes:
      label: How to test it
      description: Deterministic checks or scenarios to verify the change.
    validations:
      required: true

