name: New agent proposal
description: Propose a new workshop agent.
title: "[new-agent] "
labels: ["enhancement", "agent"]
body:
  - type: input
    id: agent_name
    attributes:
      label: Agent name
      description: Name of the new agent.
    validations:
      required: true
  - type: textarea
    id: responsibility
    attributes:
      label: What should it do?
      description: One or two sentences on the agent's job, and which stage (draft/review/rewrite) it plugs into.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else? (optional)
      description: Input context, expected output, tools/skills, eval cases, or failure modes — only if you already know them.
    validations:
      required: false
  - type: checkboxes
    id: implementation_guidelines
    attributes:
      label: Implementation guidelines (for the implementer)
      description: Follow these to stay within the workshop conventions.
      options:
        - label: "Copy `src/agent_inclusion_lab/agents/rewrite_agent_llm/` as the template — it is the canonical example agent."
        - label: "Put the new agent in its own folder `src/agent_inclusion_lab/agents/<name>/` exporting `AGENT_PLUGIN`; do not edit `workflow.py` or `registry.py`."
        - label: "Make it opt-in via the matching `INCLUSION_*_AGENT` env var, and add a deterministic test."
