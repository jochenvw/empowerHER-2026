[project]
name = "agent-inclusion-lab"
version = "0.1.0"
description = "Workshop scaffold for inclusion-focused agent workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-identity>=1.25.3",
  "chainlit>=2.11.1",
  "openai>=2.41.0",
  "python-dotenv>=1.2.2",
  "pytest>=9.0.3",
  "agent-framework==1.8.0",
]

[project.scripts]
eh = "agent_inclusion_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_inclusion_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
