[project]
name = "agent-inclusion-lab"
version = "0.1.0"
description = "Workshop scaffold for inclusion-focused agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17.1",
  "chainlit>=2.6.0",
  "openai>=1.55.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.2.0",
]

[project.scripts]
eh = "agent_inclusion_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_inclusion_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
